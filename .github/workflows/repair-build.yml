name: Verify Cloudflare Pages build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Synchronize lockfile
        run: npm install --package-lock-only

      - name: Install from lockfile
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Verify Cloudflare Pages output
        run: |
          test -d out
          test -f out/index.html
          echo "Cloudflare Pages output is ready: $(find out -type f | wc -l) files"

      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: synchronize npm lockfile"
          git push
